<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <base href="__BASE_HREF__" />
    <title data-i18n="appName">HTML Vault — Login</title>
    <link rel="stylesheet" href="static/css/styles.css" />
  </head>
  <body>
    <div class="layout">
      <header class="topbar">
        <div class="brand">
          <span class="brand-dot" aria-hidden="true">
            <svg viewBox="0 0 24 24" fill="none" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M21 15v4a2 2 0 0 1-2 2H5a2 2 0 0 1-2-2v-4"/><polyline points="17 8 12 3 7 8"/><line x1="12" y1="3" x2="12" y2="15"/></svg>
          </span>
          <span data-i18n="appName">HTML Vault</span>
        </div>
        <button id="lang-toggle" class="lang-toggle" type="button" aria-label="Switch language">
          <svg viewBox="0 0 24 24" fill="none" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><circle cx="12" cy="12" r="10"/><line x1="2" y1="12" x2="22" y2="12"/><path d="M12 2a15.3 15.3 0 0 1 4 10 15.3 15.3 0 0 1-4 10 15.3 15.3 0 0 1-4-10 15.3 15.3 0 0 1 4-10z"/></svg>
          <span data-i18n="lang.switch">中文</span>
        </button>
      </header>

      <main>
        <div class="container" style="max-width:420px">
          <section class="hero" style="text-align:center">
            <h1 data-i18n="appName">HTML Vault</h1>
          </section>

          <div class="card" style="padding:32px">
            <div id="login-form">
              <h2 style="margin:0 0 24px;font-size:20px;font-weight:600" data-i18n="auth.loginTitle">Sign in</h2>

              <div id="login-error" class="alert alert-error" hidden>
                <svg viewBox="0 0 24 24" fill="none" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><circle cx="12" cy="12" r="10"/><line x1="12" y1="8" x2="12" y2="12"/><line x1="12" y1="16" x2="12.01" y2="16"/></svg>
                <span class="msg"></span>
              </div>

              <div class="form-group" style="margin-bottom:16px">
                <label class="form-label" for="login-email" data-i18n="auth.email">Email</label>
                <input id="login-email" class="form-input" type="email" autocomplete="email" placeholder="you@example.com" />
              </div>
              <div class="form-group" style="margin-bottom:20px">
                <label class="form-label" for="login-password" data-i18n="auth.password">Password</label>
                <input id="login-password" class="form-input" type="password" autocomplete="current-password" />
              </div>
              <button id="login-submit" class="btn btn-primary" type="button" style="width:100%" data-i18n="auth.login">Sign in</button>
              <p style="text-align:center;margin:16px 0 0;font-size:14px;color:var(--text-muted)">
                <span data-i18n="auth.noAccount">No account?</span>
                <a href="javascript:void(0)" id="show-register" style="margin-left:4px" data-i18n="auth.register">Register</a>
              </p>
            </div>

            <div id="register-form" hidden>
              <h2 style="margin:0 0 24px;font-size:20px;font-weight:600" data-i18n="auth.registerTitle">Create account</h2>

              <div id="register-error" class="alert alert-error" hidden>
                <svg viewBox="0 0 24 24" fill="none" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><circle cx="12" cy="12" r="10"/><line x1="12" y1="8" x2="12" y2="12"/><line x1="12" y1="16" x2="12.01" y2="16"/></svg>
                <span class="msg"></span>
              </div>
              <div id="register-info" class="alert alert-info" hidden>
                <svg viewBox="0 0 24 24" fill="none" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><circle cx="12" cy="12" r="10"/><line x1="12" y1="16" x2="12" y2="12"/><line x1="12" y1="8" x2="12.01" y2="8"/></svg>
                <span class="msg"></span>
              </div>

              <div class="form-group" style="margin-bottom:16px">
                <label class="form-label" for="reg-email" data-i18n="auth.email">Email</label>
                <input id="reg-email" class="form-input" type="email" autocomplete="email" placeholder="you@example.com" />
              </div>
              <div class="form-group" style="margin-bottom:16px">
                <label class="form-label" for="reg-code" data-i18n="auth.verificationCode">Verification Code</label>
                <div style="display:flex;gap:8px">
                  <input id="reg-code" class="form-input" type="text" maxlength="6" placeholder="000000" style="flex:1" />
                  <button id="send-code-btn" class="btn btn-ghost" type="button" style="white-space:nowrap" data-i18n="auth.sendCode">Send Code</button>
                </div>
              </div>
              <div class="form-group" style="margin-bottom:20px">
                <label class="form-label" for="reg-password" data-i18n="auth.password">Password</label>
                <input id="reg-password" class="form-input" type="password" autocomplete="new-password" placeholder="Min 6 characters" />
              </div>
              <button id="register-submit" class="btn btn-primary" type="button" style="width:100%" data-i18n="auth.createAccount">Create Account</button>
              <p style="text-align:center;margin:16px 0 0;font-size:14px;color:var(--text-muted)">
                <span data-i18n="auth.hasAccount">Already have an account?</span>
                <a href="javascript:void(0)" id="show-login" style="margin-left:4px" data-i18n="auth.login">Sign in</a>
              </p>
            </div>
          </div>
        </div>
      </main>

      <footer class="footer">
        <span data-i18n="footer.note">Files are stored privately on the server and only accessible via the generated URL.</span>
      </footer>
    </div>

    <div id="toast" class="toast" role="status" aria-live="polite"></div>

    <script type="module" src="static/js/auth.js"></script>
  </body>
</html>
