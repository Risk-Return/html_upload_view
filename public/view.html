<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <base href="__BASE_HREF__" />
    <title data-i18n="view.heading">HTML Preview</title>
    <link rel="stylesheet" href="static/css/styles.css" />
  </head>
  <body>
    <div class="view-layout">
      <header class="view-bar">
        <div class="left">
          <a class="brand" href="./">
            <span class="brand-dot" aria-hidden="true">
              <svg viewBox="0 0 24 24" fill="none" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M19 12H5"/><polyline points="12 19 5 12 12 5"/></svg>
            </span>
            <span data-i18n="view.back">Back to upload</span>
          </a>
          <span id="url-pill" class="url-pill" aria-label="Current URL"></span>
        </div>
        <div class="right">
          <button id="copy-btn" class="lang-toggle" type="button" aria-label="Copy link">
            <svg viewBox="0 0 24 24" fill="none" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><rect x="9" y="9" width="13" height="13" rx="2" ry="2"/><path d="M5 15H4a2 2 0 0 1-2-2V4a2 2 0 0 1 2-2h9a2 2 0 0 1 2 2v1"/></svg>
            <span data-i18n="view.copy">Copy link</span>
          </button>
          <button id="lang-toggle" class="lang-toggle" type="button" aria-label="Switch language">
            <svg viewBox="0 0 24 24" fill="none" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><circle cx="12" cy="12" r="10"/><line x1="2" y1="12" x2="22" y2="12"/><path d="M12 2a15.3 15.3 0 0 1 4 10 15.3 15.3 0 0 1-4 10 15.3 15.3 0 0 1-4-10 15.3 15.3 0 0 1 4-10z"/></svg>
            <span data-i18n="lang.switch">中文</span>
          </button>
        </div>
      </header>
      <div class="iframe-wrap">
        <iframe id="preview" data-role="preview" sandbox="allow-scripts allow-same-origin" referrerpolicy="no-referrer" title="HTML preview"></iframe>
      </div>
    </div>
    <div id="toast" class="toast" role="status" aria-live="polite"></div>
    <script type="module" src="static/js/view.js"></script>
  </body>
</html>
